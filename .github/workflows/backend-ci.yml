name: PaySphere Backend CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

# The workflow only needs to read the repository.
permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, Test & Package
    runs-on: ubuntu-latest

    # Services run as Docker containers alongside the job
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: paysphere_test
          POSTGRES_USER: paysphere_test
          POSTGRES_PASSWORD: paysphere_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21 (Temurin LTS)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Integration tests start their own PostgreSQL with Testcontainers
      # (Docker is available on ubuntu-latest runners).
      - name: Build and run tests
        working-directory: backend
        env:
          RAZORPAY_KEY_ID: rzp_test_placeholder_for_ci
          RAZORPAY_KEY_SECRET: test_secret_placeholder
          RAZORPAY_WEBHOOK_SECRET: test_webhook_placeholder
          RAZORPAY_MODE: test
          JWT_SECRET: ci_jwt_secret_that_is_at_least_64_characters_long_for_testing_1234
          # These are overridden by Testcontainers @DynamicPropertySource
          DATABASE_URL: jdbc:postgresql://localhost:5432/paysphere_test
          DB_USER: paysphere_test
          DB_PASSWORD: paysphere_test_password
        run: mvn -B verify --no-transfer-progress

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: backend/target/surefire-reports/
          retention-days: 7

      - name: Check for secret leakage in build output
        working-directory: backend
        run: |
          # Look for something shaped like a real live Razorpay key
          # (rzp_live_ followed by 10 or more letters or digits) in TEXT files only.
          # -I skips compiled .class files, which legitimately contain the bare text
          # "rzp_live_" from our own safety guard in RazorpayConfig.
          # -l prints only file names, so a real key is never echoed into the CI log.
          # Real secret scanning should use a dedicated tool (gitleaks, trufflehog).
          if grep -rIlE "rzp_live_[A-Za-z0-9]{10,}" target/ src/ 2>/dev/null; then
            echo "::error::Possible live Razorpay key found (see file names above)"
            exit 1
          fi
          echo "No live credentials detected."
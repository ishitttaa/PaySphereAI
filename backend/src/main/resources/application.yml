# ─────────────────────────────────────────────────────────────────
# PaySphere Backend — Application Configuration
#
# HOW SECRETS WORK HERE:
# Values like ${DATABASE_URL} are placeholders. Spring reads them
# from environment variables at startup. The actual values are
# NEVER committed to git.
#
# For local dev: copy .env.example → .env and fill in your values,
# then export them or use your IDE's "env file" run configuration.
# ─────────────────────────────────────────────────────────────────

spring:
  application:
    name: paysphere-backend

  # ── Database (PostgreSQL) ──────────────────────────────────────
  datasource:
    url: ${DATABASE_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    # HikariCP connection pool (Spring Boot default)
    hikari:
      pool-name: PaySphere-DB-Pool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000  # 30 seconds
      idle-timeout: 600000       # 10 minutes
      max-lifetime: 1800000      # 30 minutes

  # ── JPA / Hibernate ───────────────────────────────────────────
  jpa:
    hibernate:
      # IMPORTANT: "validate" — Hibernate checks the schema matches entities
      # but does NOT create or modify tables. Flyway owns the schema.
      ddl-auto: validate
    show-sql: false           # Set to true for debugging; never in production
    properties:
      hibernate:
        format_sql: true
        default_schema: public
        jdbc:
          time_zone: UTC     # Store all timestamps in UTC

  # ── Flyway (schema migrations) ────────────────────────────────
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    # Flyway runs automatically on startup before Hibernate validates
    # Migration files: V1__description.sql, V2__description.sql, etc.

  # ── Jackson (JSON serialization) ──────────────────────────────
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false   # Use ISO-8601 strings for dates
    deserialization:
      fail-on-unknown-properties: false  # Ignore extra fields from clients

# ── Server ────────────────────────────────────────────────────────
server:
  port: ${SERVER_PORT:8080}
  error:
    # SECURITY: Never include stack trace in API error responses
    include-stacktrace: never
    include-exception: false
    include-message: never  # We control error messages via GlobalExceptionHandler

# ── Spring Boot Actuator ──────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        # Only expose health and info actuator endpoints publicly.
        # In production, restrict /actuator to internal network only.
        include: health,info
  endpoint:
    health:
      show-details: when-authorized  # Full details only for authenticated users

# ── Application Info (used by HealthController) ───────────────────
info:
  app:
    name: PaySphere
    version: 1.0.0
    description: Secure Payment Integration Platform

# ── Logging ───────────────────────────────────────────────────────
logging:
  level:
    root: INFO
    com.paysphere: DEBUG          # Our code at DEBUG level during development
    org.springframework.security: INFO
    org.flywaydb: INFO
    # NEVER set org.hibernate.SQL to DEBUG in production (logs all queries)
    # org.hibernate.SQL: DEBUG   ← uncomment only for debugging
  pattern:
    # Include timestamp, level, thread, logger, and message
    # Correlation ID will be added to MDC in a later milestone
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

# ── SpringDoc / Swagger UI ────────────────────────────────────────
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha

# ── Razorpay (keys injected from environment, never hardcoded) ────
razorpay:
  key-id: ${RAZORPAY_KEY_ID:RAZORPAY_KEY_NOT_CONFIGURED}
  key-secret: ${RAZORPAY_KEY_SECRET:RAZORPAY_SECRET_NOT_CONFIGURED}
  webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:RAZORPAY_WEBHOOK_NOT_CONFIGURED}
  mode: ${RAZORPAY_MODE:test}
  base-url: https://api.razorpay.com/v1
